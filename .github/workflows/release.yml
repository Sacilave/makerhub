name: Release

on:
  workflow_dispatch:
    inputs:
      live_canary_confirmed:
        description: "Confirm a real MakerWorld read-only live canary passed on this exact main commit"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: makerhub-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(tr -d '\r\n' < RELEASE_VERSION)"
          TAG="v${RELEASE_VERSION}"
          python scripts/check_release_version.py --tag "${TAG}"
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then echo "::error::Releases must run from main."; exit 1; fi
          if [[ "${{ inputs.live_canary_confirmed }}" != "true" ]]; then echo "::error::Run the real-account read-only live canary first, then confirm it passed."; exit 1; fi
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest PyYAML
      - name: Backend + security tests
        run: |
          python -m pytest -q
          python scripts/check_security_invariants.py
          python scripts/check_release_version.py --tag "${{ steps.version.outputs.tag }}"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests + build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Build exact release candidate
        run: docker build --pull -t makerhub:release-candidate .
      - name: Release candidate E2E gate
        env:
          MAKERHUB_E2E_IMAGE: makerhub:release-candidate
        run: bash scripts/release_gate.sh
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact tested image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/makerhub:${{ steps.version.outputs.release_version }}"
          docker tag makerhub:release-candidate "${IMAGE}"
          PUSH_OUTPUT="$(docker push "${IMAGE}" 2>&1 | tee /dev/stderr)"
          DIGEST="$(printf '%s\n' "${PUSH_OUTPUT}" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
          test -n "${DIGEST}"
          IMMUTABLE="ghcr.io/${OWNER}/makerhub@${DIGEST}"
          echo "tagged_image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "immutable_image=${IMMUTABLE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Verify anonymous GHCR pull
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.immutable_image }}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "${IMAGE}" >/dev/null 2>&1 || true
          if ! docker pull "${IMAGE}"; then
            echo "::error::The GHCR package is not anonymously pullable. Set the makerhub container package visibility to Public, then re-run the release workflow."
            exit 1
          fi
      - name: Build Windows amd64 + Linux amd64 bundles
        run: |
          python scripts/build_release_bundles.py --image "${{ steps.image.outputs.immutable_image }}" --release-version "${{ steps.version.outputs.release_version }}"
          bash -n packaging/linux-amd64/makerhub.sh
      - name: Verify release archives
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c dist/SHA256SUMS
          mkdir -p /tmp/makerhub-release-check
          unzip -q dist/makerhub-windows-amd64.zip -d /tmp/makerhub-release-check/windows
          tar -xzf dist/makerhub-linux-amd64.tar.gz -C /tmp/makerhub-release-check
          grep -F "${{ steps.image.outputs.immutable_image }}" /tmp/makerhub-release-check/windows/makerhub-windows-amd64/compose.yaml
          grep -F "${{ steps.image.outputs.immutable_image }}" /tmp/makerhub-release-check/makerhub-linux-amd64/compose.yaml
          bash -n /tmp/makerhub-release-check/makerhub-linux-amd64/makerhub.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("/tmp/makerhub-release-check/windows/makerhub-windows-amd64/makerhub.ps1",[ref]$tokens,[ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
      - name: Create annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then echo "::error::Tag ${TAG} already exists."; exit 1; fi
          git config user.name "Sacilave"
          git config user.email "sacilave@gmail.com"
          git tag -a "${TAG}" "${GITHUB_SHA}" -m "MakerHub ${TAG}"
          git push origin "${TAG}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          cat > /tmp/release-notes.md <<EOF
          ## MakerHub ${{ steps.version.outputs.release_version }}

          - Windows x86-64 / amd64: `makerhub-windows-amd64.zip`
          - Linux x86-64 / amd64: `makerhub-linux-amd64.tar.gz`
          - Tested immutable image: `${{ steps.image.outputs.immutable_image }}`
          - Maintainer: Sacilave <sacilave@gmail.com>
          EOF
          gh release create "${TAG}" dist/makerhub-windows-amd64.zip dist/makerhub-linux-amd64.tar.gz dist/SHA256SUMS dist/release-manifest.json --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "MakerHub ${{ steps.version.outputs.release_version }}" --notes-file /tmp/release-notes.md
