name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "hardened-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest PyYAML
      - name: Run backend tests
        run: python -m pytest -q
      - name: Security invariants
        run: python scripts/check_security_invariants.py
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Generate CI secrets
        run: python scripts/bootstrap_secrets.py
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          push: false
          tags: makerhub:verify
      - name: Smoke test image
        run: |
          docker run --rm -i --entrypoint python makerhub:verify - <<'PY'
          from importlib.metadata import version
          import cv2
          import app.main
          assert version("pillow") == "12.3.0"
          assert version("opencv-python-headless") == "4.14.0.94"
          assert version("cryptography") == "50.0.1"
          assert cv2.__version__.startswith("4.14.")
          print("smoke test OK")
          PY
