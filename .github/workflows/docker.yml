name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "hardened-*"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest PyYAML
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          python -m pytest -q > /tmp/pytest.log 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::group::pytest failure tail"
            tail -n 200 /tmp/pytest.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 20 /tmp/pytest.log
      - name: Security invariants
        run: python scripts/check_security_invariants.py
      - name: Release version consistency
        run: python scripts/check_release_version.py
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Validate source Compose
        env:
          MAKERHUB_POSTGRES_PASSWORD: verify-postgres-password
          MAKERHUB_CLOAKBROWSER_AUTH_TOKEN: verify-cloakbrowser-token
          MAKERHUB_DATA_ENCRYPTION_KEY_PATH: /tmp/verify-state-key
          MAKERHUB_DATA_ENCRYPTION_PREVIOUS_KEYS_PATH: /tmp/verify-previous-keys
        run: |
          printf 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' >/tmp/verify-state-key
          : >/tmp/verify-previous-keys
          docker compose config --quiet
      - name: Build exact release candidate image
        run: docker build --pull -t makerhub:verify .
      - name: Image smoke test
        run: |
          docker run --rm -i --entrypoint python makerhub:verify - <<'PY'
          from importlib.metadata import version
          import cv2, app.main
          assert version("pillow") == "12.3.0"
          assert version("opencv-python-headless") == "4.14.0.94"
          assert version("cryptography") == "50.0.1"
          assert cv2.__version__.startswith("4.14.")
          print("image smoke test OK")
          PY
          docker run --rm --entrypoint node makerhub:verify --version
      - name: Full Compose E2E release gate
        env:
          MAKERHUB_E2E_IMAGE: makerhub:verify
        run: bash scripts/release_gate.sh
      - name: Package builder self-test
        run: |
          python scripts/build_release_bundles.py --image ghcr.io/sacilave/makerhub@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          assert zipfile.is_zipfile(Path("dist/makerhub-windows-amd64.zip"))
          assert tarfile.is_tarfile(Path("dist/makerhub-linux-amd64.tar.gz"))
          print("release bundles OK")
          PY
          bash -n packaging/linux-amd64/makerhub.sh
