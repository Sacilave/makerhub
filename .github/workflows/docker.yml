name: Docker

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest PyYAML

      - name: Run backend tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Compose files
        env:
          MAKERHUB_POSTGRES_PASSWORD: ci-postgres-password
          MAKERHUB_CLOAKBROWSER_AUTH_TOKEN: ci-cloakbrowser-token
          MAKERHUB_DATA_ENCRYPTION_KEY_PATH: /tmp/verify-state-key
          MAKERHUB_DATA_ENCRYPTION_PREVIOUS_KEYS_PATH: /tmp/verify-previous-keys
        run: |
          printf 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' >/tmp/verify-state-key
          : >/tmp/verify-previous-keys
          docker compose -f compose.yaml config --quiet

      - name: Check release version
        run: |
          python scripts/check_release_version.py
          python scripts/check_security_invariants.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          push: false
          tags: makerhub:verify

      - name: Smoke test image
        run: |
          docker run --rm makerhub:verify python -c "from importlib.metadata import version; from pathlib import Path; import cv2, numpy as np; import app.main; from app.services.makerworld_captcha_vision import solve_click_challenge; image_version = Path('/app/VERSION').read_text(encoding='utf-8').strip(); assert image_version; assert app.main.app.version == image_version; version('fastapi'); version('opencv-python-headless'); version('cryptography'); target = np.full((96, 96, 4), 255, dtype=np.uint8); candidate = np.full((96, 96, 4), 255, dtype=np.uint8); cv2.fillPoly(target, [np.array([(48, 14), (14, 78), (82, 78)])], (20, 20, 20, 255)); cv2.circle(candidate, (48, 48), 28, (20, 20, 20, 255), -1); encode = lambda image: cv2.imencode('.png', image)[1].tobytes(); result = solve_click_challenge(encode(target), [encode(candidate), encode(target)]); assert result['ok'] and result['candidate_index'] == 1"
          docker run --rm makerhub:verify node --version
          MAKERHUB_E2E_IMAGE=makerhub:verify bash scripts/release_gate.sh
          python scripts/build_release_bundles.py --image ghcr.io/sacilave/makerhub@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          assert zipfile.is_zipfile(Path('dist/makerhub-windows-amd64.zip'))
          assert tarfile.is_tarfile(Path('dist/makerhub-linux-amd64.tar.gz'))
          PY
          bash -n packaging/linux-amd64/makerhub.sh

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: makerhub-release-promotion
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Check release tag
        run: |
          set -euo pipefail
          python scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check version tag availability
        run: |
          set -euo pipefail
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/makerhub:${GITHUB_REF_NAME}"
          INSPECT_OUTPUT="$(mktemp)"
          trap 'rm -f "${INSPECT_OUTPUT}"' EXIT
          set +e
          docker buildx imagetools inspect "${IMAGE_REF}" >"${INSPECT_OUTPUT}" 2>&1
          INSPECT_STATUS=$?
          set -e
          if [ "${INSPECT_STATUS}" -eq 0 ]; then
            echo "::error::Version tag ${GITHUB_REF_NAME} already exists and is immutable."
            exit 1
          fi
          cat "${INSPECT_OUTPUT}" >&2
          echo "::warning::GHCR manifest precheck was unavailable; continuing to the image push."

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ghcr.io/${{ github.repository_owner }}/makerhub
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify anonymous GHCR pull
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/makerhub@${{ steps.build.outputs.digest }}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "${IMAGE}"

      - name: Build portable release bundles
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/makerhub@${{ steps.build.outputs.digest }}"
          python scripts/build_release_bundles.py --image "${IMAGE}"
          sha256sum -c dist/SHA256SUMS
          mkdir -p /tmp/makerhub-release-check
          unzip -q dist/makerhub-windows-amd64.zip -d /tmp/makerhub-release-check/windows
          tar -xzf dist/makerhub-linux-amd64.tar.gz -C /tmp/makerhub-release-check
          grep -F "${IMAGE}" /tmp/makerhub-release-check/windows/makerhub-windows-amd64/compose.yaml
          grep -F "${IMAGE}" /tmp/makerhub-release-check/makerhub-linux-amd64/compose.yaml
          bash -n /tmp/makerhub-release-check/makerhub-linux-amd64/makerhub.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("/tmp/makerhub-release-check/windows/makerhub-windows-amd64/makerhub.ps1",[ref]$tokens,[ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836
        with:
          generate_release_notes: true
          files: |
            dist/makerhub-windows-amd64.zip
            dist/makerhub-linux-amd64.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json

      - name: Promote verified release as latest
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/makerhub"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${GITHUB_REF_NAME}"
